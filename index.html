<!doctype html>

<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- SEO -->
		<title>Caliroad</title>
		<meta
			name="description"
			content="The visual encyclopedia of Calisthenics exercises"
		/>
		<link rel="icon" type="image/x-icon" href="assets/logo.png" />

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
		<link
			href="https://fonts.cdnfonts.com/css/questrial"
			rel="stylesheet"
		/>
		<link href="https://fonts.cdnfonts.com/css/ekatori" rel="stylesheet" />

		<!-- Styles -->
		<link rel="stylesheet" href="styles/main.css" />

		<!-- Scripts -->
		<script
			src="https://unpkg.com/external-svg-loader@1.0.0/svg-loader.min.js"
			defer
		></script>
		<script src="scripts/auto-theme-toggle.js"></script>
		<script defer type="module" src="scripts/main.js"></script>
	</head>
	<body>
		<header>
			<button id="search" class="text-button">Search</button>

			<a class="logo" href="#planche">
				<img src="assets/logo.png" alt="Caliroad logo" />
				<p>Caliroad</p>
			</a>

			<button id="filter" class="text-button">Filter</button>
		</header>

		<main></main>

		<footer>
			<div class="settings">
				<button
					id="settings-button"
					class="icon-button"
					title="Settings"
					popovertarget="settings-menu"
				>
					<svg data-src="assets/cogwheel.svg"></svg>
				</button>

				<div id="settings-menu" popover>
					<p>Settings</p>
					<div class="options">
						<label id="dark-mode-toggle" class="switch">
							<span class="switch-box">
								<input type="checkbox" />
								<span class="slider"></span>
							</span>
							<span class="label">Dark mode</span>
						</label>

						<label id="preferences-toggle" class="switch">
							<span class="switch-box">
								<input type="checkbox" />
								<span class="slider"></span>
							</span>
							<span class="label">Remember my preferences</span>
						</label>
					</div>
				</div>
			</div>

			<p>
				Made with ❤️ by <a href="https://github.com/pocco81">Pocco81</a>
			</p>

			<button id="info-button" class="icon-button" title="Info">
				<svg data-src="assets/info.svg"></svg>
			</button>
		</footer>

		<dialog id="exercise-window" closeby="closerequest">
			<button class="close-button">&times;</button>
			<div class="banner">
				<img alt="Banner image" />
				<h1></h1>
				<div class="avatar">
					<img src="assets/planche_avatar.png" alt="Avatar" />
				</div>
			</div>
			<div class="content">
				<div class="muscles"></div>
				<div class="freeform"></div>
			</div>
		</dialog>

		<dialog id="info-popup">
			<button class="close-button">&times;</button>
			<h2 class="popup-title">Welcome to Caliroad!</h2>
			<h3 class="popup-subtitle">
				The visual encyclopedia of Calisthenics exercises
			</h3>

			<ul>
				<li>Click on nodes to see the contents of an exercise</li>
				<li>Use the filter to view relationships between exercises</li>
				<li>Use the search bar to locate an specific exercise</li>
			</ul>
		</dialog>
	</body>
</html>
