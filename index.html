<!doctype html>

<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="description"
			content="The visual encyclopedia of Calisthenics exercises "
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Caliroad</title>
		<link rel="icon" type="image/x-icon" href="assets/logo.png" />
		<link rel="preconnect" href="https://fonts.cdnfonts.com" />
		<link
			href="https://fonts.cdnfonts.com/css/questrial"
			rel="stylesheet"
		/>
		<link href="https://fonts.cdnfonts.com/css/lamarkie" rel="stylesheet" />
		<link rel="stylesheet" href="styles/main.css" />
		<script src="scripts/auto-theme-toggle.js"></script>
		<script defer src="scripts/main.js"></script>
	</head>
	<body>
		<header>
			<a class="logo" href="#">
				<img
					class="logo-image"
					src="assets/logo.png"
					alt="Caliroad logo"
				/>
				<span class="logo-text">Caliroad</span>
			</a>
			<button id="settings" class="svg-button" type="button">
				<img src="assets/cogwheel.svg" alt="Search" />
			</button>
		</header>

		<main></main>

		<footer>
			<button id="help" class="svg-button" type="button">
				<img src="assets/help-circle.svg" alt="Search" />
			</button>
		</footer>
	</body>
</html>
