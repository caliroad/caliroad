<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

		<!-- SEO -->
		<title>Caliroad</title>
		<meta name="description" content="The visual encyclopedia of Calisthenics exercises" />
		<link rel="icon" type="image/x-icon" href="./shared/assets/logo.png" />

		<!-- Scripts -->
		<script defer type="module" src="./app/main.js"></script>
	</head>
	<body>
		<header>
			<button id="search" class="text-button" data-i18n="search"></button>

			<a class="logo" href="#planche">
				<img src="./shared/assets/logo.png" alt="Caliroad logo" />
				<p>Caliroad</p>
			</a>

			<button id="filter" class="text-button" data-i18n="filter"></button>
		</header>

		<main></main>

		<footer>
			<div class="settings">
				<button id="settings-button" class="icon-button" data-i18n="[title]footer.settings">
					<div id="settings-icon"></div>
				</button>
			</div>

			<p><span data-i18n="footer.phrase"></span> <a href="https://github.com/pocco81">Pocco81</a></p>

			<button id="info-button" class="icon-button" data-i18n="[title]footer.info">
				<div id="info-icon"></div>
			</button>
		</footer>
	</body>
</html>
